spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    username: anuj
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: razorpay-clone-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.codingshuttle.razorpay.*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

app:
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refund.events
      settlement: settlement.events

---

spring:
  config:
    activate:
      on-profile: k8s
  data:
    redis:
      host: redis.razorpay-core.svc.cluster.local
      port: 6379
  kafka:
    bootstrap-servers: kafka.razorpay-core.svc.cluster.local:9092
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://zipkin.razorpay-core.svc.cluster.local:9411/api/v2/spans

MERCHANT_SERVICE_URI: http://merchant-service
PAYMENT_SERVICE_URI: http://payment-service
VAULT_SERVICE_URI: http://vault-service
OPERATIONS_SERVICE_URI: http://operations-service